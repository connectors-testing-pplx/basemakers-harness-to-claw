name: Feature request
description: Suggest an improvement to the analysis or its visualizations
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: A new visualization, section, or content correction.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
    validations:
      required: false
